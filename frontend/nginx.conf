# The web app and its API on one address: pages from the build, /api/... forwarded to the backend.
server {
    listen 80;
    server_name _;

    # Excel uploads (the backend's own limit is MAX_UPLOAD_MB, 25 by default).
    client_max_body_size 30m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # Optional password for the whole site (the app itself has none). To use it, create the file with
    #   docker compose exec web sh -c "apk add --no-cache apache2-utils && htpasswd -c /etc/nginx/.htpasswd admin"
    # then remove the # from the next two lines and run: docker compose restart web
    # auth_basic "Accounts.ai";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chat answers stream word by word (Server-Sent Events): pass them on at once, and allow long answers.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Built files have content hashes in their names, so they can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
