# Run Accounts.ai on a server (e.g. a Hostinger VPS): docker compose up -d --build
# Needs backend/.env with DATABASE_URL and OPENAI_API_KEY (copy backend/.env.example). The site is then on port 80.
# Nothing is kept on the server's disk: the books, uploads and chats are in the database DATABASE_URL points at (Supabase),
# so there is no data volume, and a rebuild or a new server starts with everything there.
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
